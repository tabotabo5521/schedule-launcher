plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.tabotabo5521.schedule'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.tabotabo5521.schedule'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName "1.0." + (System.getenv('VERSION_CODE') ?: '1')
    }

    signingConfigs {
        release {
            // The keystore and passwords come from the CI environment, never from the repository.
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'release.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'schedule'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
